nd\&quot;,\&quot;Auckland\&quot;,\&quot;Waikato\&quot;,\&quot;Bay of Plenty\&quot;,\&quot;Gisborne\&quot;,\&quot;Hawke&#039;s Bay\&quot;,\&quot;Taranaki\&quot;,\&quot;Manawat\u016b-Whanganui\&quot;,\&quot;Wellington\&quot;,\&quot;Tasman\&quot;,\&quot;Nelson\&quot;,\&quot;Marlborough\&quot;,\&quot;West Coast\&quot;,\&quot;Canterbury\&quot;,\&quot;Otago\&quot;,\&quot;Southland\&quot;\n\&quot;2024\&quot;,924,13821,2887,1497,172,718,435,1118,1883,301,243,262,196,6702,2182,335\n\&quot;2025\&quot;,725,14760,2881,1382,156,675,438,1031,2083,295,248,175,183,6799,2676,374\n\&quot;2026\&quot;,888,17131,3265,1761,209,775,430,1042,2403,280,279,203,155,8906,2910,454\n&quot;}],&quot;GraphType&quot;:&quot;bar&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;New dwellings consented, by region, year ended, September 2024\u20132026&quot;,&quot;showLegend&quot;:true,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;135726&quot;,&quot;Title&quot;:&quot;Building consents issued: September 2026 \u2013 key facts 3&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h3&gt;New dwellings consented per 1,000 residents&lt;\/h3&gt;\n&lt;p&gt;The number of new dwellings consented per 1,000 residents across New Zealand was 7.7 for the year ended September 2026, compared with 6.6 in the year ended September 2025. The record number of new dwellings consented per 1,000 residents was 13.4 in the year ended December 1973.&lt;\/p&gt;\n&lt;p&gt;National population estimates are updated quarterly, and subnational population estimates are updated annually in October, and are provisional. Population estimates after June 2023 used the 2023-base estimated residen ;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;135727&quot;,&quot;Title&quot;:&quot;Building consents issued: September 2026 \u2013 key facts 4&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h3&gt;Non-residential building consents&lt;\/h3&gt;\n&lt;p&gt;In the year ended September 2026, non-residential building consents totalled $8.7 billion, down 3.1 percent from the year ended September 2025. This series can be influenced by price changes \u2013 non-residential construction prices (as measured by the capital goods price index) were up 2.2 percent in the year ended June 2026.&lt;\/p&gt;\n&lt;p&gt;In the year ended September 2026, the non-residential building types with the highest values were:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;offices, administration, and public transport buildings at $1.5 billion (down 21 percent)&lt;\/li&gt;\n&lt;li&gt;education buildings at $1.4 billion (up 12 percent)&lt;\/li&gt;\n&lt;li&gt;storage buildings at $1.3 billion (down 0.2 percent).&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;135716&quot;,&quot;Title&quot;:&quot;BCI Sep26 G5 Value of non-residential building consents ($), including alterations and additions, year ended, September 2024\u20132026&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Building type&quot;,&quot;yAxisTitle&quot;:&quot;$&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:35941,&quot;Title&quot;:&quot;Value of non-residential building consents ($), including alterations and additions, year ended, September 2024\u20132026&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quo
